services:
  - type: web
    name: google-maps-scraper-mcp
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: false
      - key: API_KEY
        generateValue: true
      - key: DEFAULT_GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
